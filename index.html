<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Tower Defense V4</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080b18,#18214a);color:#fff;font-family:Arial,sans-serif}header,main{max-width:1200px;margin:auto;padding:14px}.brand,.nav,.stats,.units,.team{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.brand{justify-content:space-between}.btn,.unit,.card{background:#121a31;border:1px solid #40527d;color:#fff;border-radius:12px;padding:10px 14px}.btn,.unit{cursor:pointer}.btn:hover,.unit:hover,.sel{background:#2a3153;border-color:#ffd166}.screen{display:none}.screen.on{display:block}.panel{background:#10182c;border:1px solid #33446c;border-radius:16px;padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card{background:#17213a}.small{color:#b9c3da;font-size:13px}.rar{color:#ffd166}canvas{display:block;width:100%;border:2px solid #41547f;border-radius:16px;background:#0f172b}</style></head><body><header><div class="brand"><h1>🌌 Anime Tower Defense <small>V4.1</small></h1><div class="stats"><span class="card">💰 <b id="money">500</b></span><span class="card">💎 <b id="gems">10</b></span><span class="card">❤️ <b id="hp">30</b></span></div></div><div id="nav" class="nav"><button class="btn" data-page="home">🏠 Home</button><button class="btn" data-page="story">📖 Story</button><button class="btn" data-page="team">👥 Team</button><button class="btn" data-page="summon">🎲 Summon</button><button class="btn" data-page="play">⚔️ PLAY</button></div></header><main><section id="home" class="screen on"><div class="panel"><h2>Anime World</h2><p>กดปุ่มด้านล่างเพื่อเข้าสู่เกม</p><button class="btn" data-page="play">▶️ เล่นเกม</button></div></section><section id="story" class="screen"><div class="panel"><h2>📖 Story Mode</h2><div id="stories"></div></div></section><section id="team" class="screen"><div class="panel"><h2>👥 จัดทีม — สูงสุด 5 ตัว</h2><div id="teamSlots" class="team"></div><h3>Collection</h3><div id="collection" class="grid"></div></div></section><section id="summon" class="screen"><div class="panel"><h2>🎲 Summon</h2><p>100 💰 ต่อครั้ง</p><button id="summon" class="btn">✨ Summon</button><p id="result"></p></div></section><section id="play" class="screen"><div class="panel"><h2>⚔️ Battle</h2><p id="info">เลือกตัวละครด้านล่าง แล้วคลิกบนสนามเพื่อวาง Tower</p><button id="wave" class="btn">▶ Start Wave</button><button id="upgrade" class="btn">⬆️ Upgrade</button><button id="reset" class="btn">🔄 Reset</button></div><div id="battleUnits" class="units"></div><canvas id="game" width="1100" height="620"></canvas></section></main><script>(()=>{const $=x=>document.getElementById(x),C={sora:['Sora','Original',60,24,125,600,'DPS','⚔️'],rei:['Rei','Original',80,11,140,220,'Speed','🏹'],kaito:['Kaito','Original',110,52,145,1000,'Heavy','🔥'],mika:['Mika','Original',130,8,135,800,'Support','✨'],yuna:['Yuna','Original',170,28,150,850,'AOE','🌙'],naruto:['Naruto','Epic',140,30,130,650,'DPS','🍥'],sasuke:['Sasuke','Epic',150,38,155,800,'Burst','⚡'],luffy:['Luffy','Legendary',180,45,120,720,'DPS','🏴‍☠️'],zoro:['Zoro','Epic',160,55,110,1100,'Heavy','⚔️'],goku:['Goku','Legendary',200,65,165,1000,'Burst','☄️'],vegeta:['Vegeta','Legendary',210,58,155,900,'Burst','💥'],ichigo:['Ichigo','Legendary',190,50,145,760,'DPS','🗡️'],rukia:['Rukia','Epic',135,22,155,500,'Control','❄️'],kakashi:['Kakashi','Legendary',175,35,170,600,'Speed','👁️']};let money=500,gems=10,hp=30,waveNo=0,owned=Object.keys(C),team=['sora','naruto','goku','ichigo','mika'],selected=team[0],chosen=null,towers=[],enemies=[],shots=[],left=0,spawn=0,running=true,last=performance.now(),pageName='home';const P=[[-20,100],[190,100],[190,250],[450,250],[450,470],[730,470],[730,160],[1120,160]],cv=$('game'),ctx=cv.getContext('2d');function go(p){pageName=p;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===p));render()}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));function render(){moneyEl();teamEl();collectionEl();battleEl();storyEl()}function moneyEl(){$('money').textContent=money;$('gems').textContent=gems;$('hp').textContent=hp}function teamEl(){$('teamSlots').innerHTML=team.map((id,i)=>`<div class="unit">${i+1}. ${C[id][7]} ${C[id][0]}<br><span class="small">${C[id][6]}</span></div>`).join('')}function collectionEl(){$('collection').innerHTML=owned.map(id=>`<div class="card"><b>${C[id][7]} ${C[id][0]}</b><div class="rar">${C[id][1]}</div><div>${C[id][6]} • DMG ${C[id][3]}</div><button class="btn add" data-id="${id}">${team.includes(id)?'ถอดออก':'ใส่ทีม'}</button></div>`).join('');document.querySelectorAll('.add').forEach(b=>b.onclick=()=>{let id=b.dataset.id;if(team.includes(id))team=team.filter(x=>x!==id);else if(team.length<5)team.push(id);else return alert('ทีมเต็ม 5 ตัว');if(!team.includes(selected))selected=team[0];render()})}function battleEl(){$('battleUnits').innerHTML=team.map(id=>`<button class="unit ${selected===id?'sel':''}" data-id="${id}">${C[id][7]} ${C[id][0]}<br><span class="small">💰${C[id][2]}</span></button>`).join('');document.querySelectorAll('#battleUnits .unit').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}function storyEl(){let a=['จุดเริ่มต้น','เมืองแห่งเงา','ทะเลดาว','ศึกเหนือฟ้า','ป้อมปราการสุดท้าย'];$('stories').innerHTML=a.map((x,i)=>`<div class="panel"><b>Chapter ${i+1}: ${x}</b><p class="small">Stage ${i+1}-1</p><button class="btn sb" data-i="${i}">▶ เล่นด่าน</button></div>`).join('');document.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{go('play');startWave()})}function summon(){if(money<100)return $('result').textContent='เงินไม่พอ';money-=100;let id=owned[Math.floor(Math.random()*owned.length)];$('result').innerHTML=`🎉 ได้ <b>${C[id][7]} ${C[id][0]}</b> (${C[id][1]})`;render()}$('summon').onclick=summon;$('wave').onclick=startWave;$('reset').onclick=reset;$('upgrade').onclick=upgrade;function startWave(){if(!running)return;if(left||enemies.length||waveNo>=20)return;waveNo++;left=6+waveNo*2;spawn=0;$('info').textContent=`Wave ${waveNo}/20 ${waveNo%5===0?'👑 BOSS WAVE':''}`}function reset(){money=500;hp=30;waveNo=0;left=0;towers=[];enemies=[];shots=[];chosen=null;running=true;$('info').textContent='เลือกตัวละคร แล้วคลิกบนสนามเพื่อวาง Tower';render()}cv.onclick=e=>{if(pageName!=='play')return;if(!selected)return $('info').textContent='เลือกตัวละครก่อน';let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1100/r.width,y=(e.clientY-r.top)*620/r.height,h=towers.find(t=>Math.hypot(t.x-x,t.y-y)<30);if(h){chosen=h;$('info').textContent=C[h.id][0]+' Lv.'+h.lv+' ถูกเลือก';return}if(near(x,y)<35||towers.some(t=>Math.hypot(t.x-x,t.y-y)<45))return $('info').textContent='ตรงนี้วางไม่ได้';let d=C[selected];if(money<d[2])return $('info').textContent='เงินไม่พอ';towers.push({x,y,id:selected,lv:1,cool:0,buff:1});money-=d[2];render()};function near(x,y){let z=999;for(let i=0;i<P.length-1;i++){let a=P[i],b=P[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy))),px=a[0]+t*dx,py=a[1]+t*dy;z=Math.min(z,Math.hypot(x-px,y-py))}return z}function addEnemy(){let boss=waveNo%5===0&&left===1,m=boss?500:70+waveNo*18;enemies.push({x:P[0][0],y:P[0][1],i:0,h:m,max:m,spd:boss?38:55+waveNo,r:boss?22:13,reward:boss?120:18,boss});left--}function update(dt){if(!running)return;if(left&&(spawn-=dt)<=0){addEnemy();spawn=.55}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],p=P[e.i+1];if(!p){hp--;enemies.splice(i,1);if(hp<=0){running=false;$('info').textContent='💀 แพ้'}continue}let dx=p[0]-e.x,dy=p[1]-e.y,d=Math.hypot(dx,dy),s=e.spd*dt;if(d<=s){e.x=p[0];e.y=p[1];e.i++}else{e.x+=dx/d*s;e.y+=dy/d*s}}for(let t of towers){let d=C[t.id];t.cool-=dt*1000;if(d[6]==='Support'){for(let q of towers)if(q!==t&&Math.hypot(q.x-t.x,q.y-t.y)<d[4])q.buff=1.2}else if(t.cool<=0){let e=enemies.filter(q=>Math.hypot(q.x-t.x,q.y-t.y)<=d[4]).sort((a,b)=>b.i-a.i)[0];if(e){shots.push({x:t.x,y:t.y,e,dmg:d[3]*(1+(t.lv-1)*.3)*(t.buff||1),aoe:d[6]==='AOE'?65:0});t.cool=d[5]}}}for(let i=shots.length-1;i>=0;i--){let b=shots[i];if(!enemies.includes(b.e)){shots.splice(i,1);continue}let dx=b.e.x-b.x,dy=b.e.y-b.y,d=Math.hypot(dx,dy),s=650*dt;if(d<=s){if(b.aoe)enemies.forEach(e=>{if(Math.hypot(e.x-b.e.x,e.y-b.e.y)<=65)e.h-=b.dmg});else b.e.h-=b.dmg;shots.splice(i,1)}else{b.x+=dx/d*s;b.y+=dy/d*s}}for(let i=enemies.length-1;i>=0;i--)if(enemies[i].h<=0){money+=enemies[i].reward;enemies.splice(i,1)}if(!left&&!enemies.length&&waveNo>=20){running=false;$('info').textContent='🏆 ชนะ 20 Waves!'}}function draw(){ctx.clearRect(0,0,1100,620);ctx.fillStyle='#0f172b';ctx.fillRect(0,0,1100,620);ctx.strokeStyle='#343b55';ctx.lineWidth=62;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...P[0]);P.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.strokeStyle='#65708a';ctx.lineWidth=48;ctx.beginPath();ctx.moveTo(...P[0]);P.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();for(let t of towers){let d=C[t.id];ctx.beginPath();ctx.arc(t.x,t.y,d[4],0,7);ctx.strokeStyle=chosen===t?'#ffd16666':'#ffffff18';ctx.stroke();ctx.beginPath();ctx.arc(t.x,t.y,25,0,7);ctx.fillStyle='#273b70';ctx.fill();ctx.font='24px Arial';ctx.textAlign='center';ctx.fillText(d[7],t.x,t.y+8);ctx.font='12px Arial';ctx.fillStyle='#fff';ctx.fillText('Lv.'+t.lv,t.x,t.y+43)}for(let e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fillStyle=e.boss?'#8b3dff':'#e34b72';ctx.fill();ctx.font='20px Arial';ctx.textAlign='center';ctx.fillText(e.boss?'👑':'👾',e.x,e.y+7);ctx.fillStyle='#5ee58a';ctx.fillRect(e.x-20,e.y-e.r-10,40*Math.max(0,e.h/e.max),5)}for(let b of shots){ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fillStyle='#ffe18a';ctx.fill()}ctx.textAlign='left'}function upgrade(){if(!chosen)return $('info').textContent='เลือก Tower ก่อน';let cost=70*chosen.lv;if(chosen.lv>=5)return $('info').textContent='Lv.5 สูงสุด';if(money<cost)return $('info').textContent='เงินไม่พอ';money-=cost;chosen.lv++;render()}function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}render();loop(last)})();</script></body></html>
