<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Tower Defense V2</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#261a48,#0b1020 70%);color:#fff;font-family:Arial,sans-serif;text-align:center}header{padding:12px}.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stat,button{background:#241f3d;color:#fff;border:1px solid #66558f;border-radius:10px;padding:10px 14px}.stat{min-width:95px}button{cursor:pointer}button:hover,.sel{background:#4b3675}canvas{max-width:96vw;border:2px solid #705da0;border-radius:14px;background:#11182b;box-shadow:0 0 30px #0008}.cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px}.card{padding:9px 12px;border:1px solid #594a7e;border-radius:10px;background:#19172d;cursor:pointer}.card.sel{border-color:#ffd166;box-shadow:0 0 12px #ffd16655}.small{font-size:12px;color:#c8c0dc}#msg{min-height:24px;font-weight:bold}</style></head><body><header><h1>🌸 Anime Tower Defense V2</h1><div class="top"><span class="stat">💰 <b id="money">300</b></span><span class="stat">❤️ <b id="hp">25</b></span><span class="stat">🌊 <b id="wave">0</b>/10</span><button onclick="startWave()">▶ เริ่ม Wave</button><button onclick="location.reload()">🔄 รีเซ็ต</button></div><div class="cards"><div class="card sel" data-t="sora">⚔️ Sora<div class="small">$60 • สมดุล</div></div><div class="card" data-t="rei">🏹 Rei<div class="small">$85 • ยิงเร็ว</div></div><div class="card" data-t="kaito">🔥 Kaito<div class="small">$110 • ดาเมจสูง</div></div><div class="card" data-t="mika">✨ Mika<div class="small">$140 • สนับสนุน</div></div><div class="card" data-t="yuna">🌙 Yuna<div class="small">$180 • AOE</div></div></div><div id="msg">เลือกตัวละครแล้วคลิกบนแผนที่เพื่อวาง</div></header><canvas id="game" width="900" height="560"></canvas><script>const c=document.getElementById('game'),ctx=c.getContext('2d');let money=300,hp=25,wave=0,selected='sora',towers=[],enemies=[],shots=[],spawn=0,left=0,over=false,last=performance.now(),fx=[];const path=[[-20,90],[170,90],[170,220],[410,220],[410,430],[670,430],[670,145],[920,145]],T={sora:{cost:60,r:125,d:22,rate:650,icon:'⚔️',color:'#67b7ff'},rei:{cost:85,r:115,d:10,rate:240,icon:'🏹',color:'#c39bff'},kaito:{cost:110,r:145,d:48,rate:1050,icon:'🔥',color:'#ff805d'},mika:{cost:140,r:130,d:8,rate:800,icon:'✨',color:'#7ee8c8',support:true},yuna:{cost:180,r:150,d:26,rate:850,icon:'🌙',color:'#8c9cff',aoe:55}};document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selected=b.dataset.t});function startWave(){if(over||left||enemies.length||wave>=10)return;wave++;left=5+wave*2;spawn=0;msg('🌸 Wave '+wave+' เริ่มแล้ว!')}c.onclick=e=>{if(over)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*560/r.height,s=T[selected];if(money<s.cost)return msg('💰 เงินไม่พอ');if(nearPath(x,y)<32||towers.some(t=>Math.hypot(t.x-x,t.y-y)<42))return msg('วางตรงนี้ไม่ได้');towers.push({x,y,type:selected,last:0});money-=s.cost;ui()};function nearPath(X,Y){let z=999;for(let i=0;i<path.length-1;i++){let a=path[i],b=path[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((X-a[0])*dx+(Y-a[1])*dy)/(dx*dx+dy*dy))),px=a[0]+t*dx,py=a[1]+t*dy;z=Math.min(z,Math.hypot(X-px,Y-py))}return z}function addEnemy(){let boss=wave%5===0&&left===1,max=boss?320:55+wave*13;enemies.push({x:path[0][0],y:path[0][1],i:0,h:max,max,spd:boss?38:52+wave*2,r:boss?20:13,reward:boss?70:14,boss,type:boss?'👑':'👾'});left--}function update(dt){if(over)return;if(left&&(spawn-=dt)<=0){addEnemy();spawn=.62}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],p=path[e.i+1];if(!p){hp--;enemies.splice(i,1);if(hp<=0)lose();continue}let dx=p[0]-e.x,dy=p[1]-e.y,d=Math.hypot(dx,dy),st=e.spd*dt;if(d<=st){e.x=p[0];e.y=p[1];e.i++;if(e.i>=path.length-1){hp--;enemies.splice(i,1);if(hp<=0)lose()}}else{e.x+=dx/d*st;e.y+=dy/d*st}}for(const t of towers){let s=T[t.type];t.last-=dt*1000;if(t.last<=0&&!s.support){let target=enemies.filter(e=>Math.hypot(e.x-t.x,e.y-t.y)<=s.r).sort((a,b)=>b.i-a.i)[0];if(target){shots.push({x:t.x,y:t.y,target,dmg:s.d,aoe:s.aoe||0});t.last=s.rate}}if(t.last<=0&&s.support){for(const a of towers)if(a!==t&&Math.hypot(a.x-t.x,a.y-t.y)<s.r)a.buff=1.18;t.last=s.rate}}for(let i=shots.length-1;i>=0;i--){let q=shots[i],e=q.target;if(!enemies.includes(e)){shots.splice(i,1);continue}let dx=e.x-q.x,dy=e.y-q.y,d=Math.hypot(dx,dy),st=520*dt;if(d<=st){if(q.aoe){for(const z of enemies)if(Math.hypot(z.x-e.x,z.y-e.y)<=q.aoe)z.h-=q.dmg}else e.h-=q.dmg;fx.push({x:e.x,y:e.y,t:.25});shots.splice(i,1);for(let j=enemies.length-1;j>=0;j--)if(enemies[j].h<=0){money+=enemies[j].reward;enemies.splice(j,1)}}else{q.x+=dx/d*st;q.y+=dy/d*st}}if(!left&&!enemies.length&&wave>=10)win();ui()}function ui(){moneyEl.textContent=money;document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave}function draw(){ctx.clearRect(0,0,900,560);let g=ctx.createLinearGradient(0,0,900,560);g.addColorStop(0,'#18254a');g.addColorStop(1,'#111326');ctx.fillStyle=g;ctx.fillRect(0,0,900,560);ctx.strokeStyle='#332c45';ctx.lineWidth=58;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...path[0]);path.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.strokeStyle='#5b5066';ctx.lineWidth=46;ctx.beginPath();ctx.moveTo(...path[0]);path.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.font='28px Arial';ctx.fillText('🏯',805,125);for(const t of towers){let s=T[t.type];ctx.beginPath();ctx.arc(t.x,t.y,s.r,0,7);ctx.strokeStyle=s.color+'55';ctx.stroke();ctx.beginPath();ctx.arc(t.x,t.y,23,0,7);ctx.fillStyle=s.color;ctx.fill();ctx.font='22px Arial';ctx.textAlign='center';ctx.fillText(s.icon,t.x,t.y+8);ctx.textAlign='left';ctx.font='12px Arial';ctx.fillStyle='#fff';ctx.fillText(t.type.toUpperCase(),t.x-22,t.y+40)}for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fillStyle=e.boss?'#b84cff':'#ef6b86';ctx.fill();ctx.font=e.boss?'22px Arial':'18px Arial';ctx.textAlign='center';ctx.fillText(e.type,e.x,e.y+7);ctx.textAlign='left';ctx.fillStyle='#111';ctx.fillRect(e.x-20,e.y-e.r-10,40,5);ctx.fillStyle='#5df29a';ctx.fillRect(e.x-20,e.y-e.r-10,40*Math.max(0,e.h/e.max),5)}for(const q of shots){ctx.beginPath();ctx.arc(q.x,q.y,5,0,7);ctx.fillStyle='#ffe98a';ctx.fill()}for(const f of fx){ctx.beginPath();ctx.arc(f.x,f.y,(.25-f.t)*130,0,7);ctx.strokeStyle='#ffd166';ctx.stroke();f.t-=.016}fx=fx.filter(f=>f.t>0)}function msg(s){document.getElementById('msg').textContent=s}function lose(){over=true;msg('💀 ฐานถูกทำลาย — แพ้')}function win(){over=true;msg('🏆 คุณผ่าน Anime Tower Defense 10 Waves!')}function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}ui();loop(last);</script></body></html>
