<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tower Defense V1</title><style>body{margin:0;background:#101827;color:#fff;font:16px Arial;text-align:center}#ui{padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.stat,button{background:#243249;color:#fff;border:1px solid #465975;border-radius:8px;padding:10px 14px}button{cursor:pointer}button:hover{background:#31445f}canvas{max-width:95vw;border:2px solid #465975;border-radius:10px;background:#182333}#msg{min-height:24px;margin:8px}</style></head><body><h1>🏰 Tower Defense V1</h1><div id="ui"><div class="stat">💰 <span id="money">150</span></div><div class="stat">❤️ <span id="hp">20</span></div><div class="stat">🌊 Wave <span id="wave">0</span></div><button onclick="startWave()">▶ เริ่ม Wave</button><button onclick="location.reload()">🔄 เริ่มใหม่</button></div><div id="msg">เลือก Tower แล้วคลิกแผนที่เพื่อวาง</div><canvas id="game" width="900" height="560"></canvas><script>const c=document.getElementById('game'),ctx=c.getContext('2d');let money=150,hp=20,wave=0,selected='basic',towers=[],enemies=[],shots=[],spawn=0,left=0,over=false,last=performance.now();const path=[[-20,90],[180,90],[180,230],[420,230],[420,430],[680,430],[680,150],[920,150]],types={basic:{cost:50,range:120,dmg:18,rate:650},rapid:{cost:75,range:105,dmg:8,rate:250},cannon:{cost:100,range:150,dmg:45,rate:1100}};function startWave(){if(over||left||enemies.length||wave>=10)return;wave++;left=6+wave*2;msg('Wave '+wave+' เริ่มแล้ว!')}c.onclick=e=>{if(over)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*560/r.height,s=types[selected];if(money<s.cost)return msg('💰 เงินไม่พอ');if(towers.some(t=>Math.hypot(t.x-x,t.y-y)<40)||nearPath(x,y)<30)return msg('วางตรงนี้ไม่ได้');towers.push({x,y,type:selected,last:0});money-=s.cost};function nearPath(x,y){let d=999;for(let i=0;i<path.length-1;i++){let a=path[i],b=path[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy))),px=a[0]+t*dx,py=a[1]+t*dy;d=Math.min(d,Math.hypot(x-px,y-py))}return d}function addEnemy(){let boss=wave%5===0&&left===1,max=boss?180:45+wave*10;enemies.push({x:path[0][0],y:path[0][1],i:0,h:max,max,spd:boss?40:55+wave*2,r:boss?16:11,reward:boss?45:12,boss});left--}function update(dt){if(over)return;if(left&& (spawn-=dt)<=0){addEnemy();spawn=.65}for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],p=path[e.i+1];if(!p){hp--;enemies.splice(i,1);if(hp<=0)lose();continue}let dx=p[0]-e.x,dy=p[1]-e.y,d=Math.hypot(dx,dy),st=e.spd*dt;if(d<=st){e.x=p[0];e.y=p[1];e.i++;if(e.i>=path.length-1){hp--;enemies.splice(i,1);if(hp<=0)lose()}}else{e.x+=dx/d*st;e.y+=dy/d*st}}for(const t of towers){let s=types[t.type];t.last-=dt*1000;if(t.last<=0){let target=enemies.filter(e=>Math.hypot(e.x-t.x,e.y-t.y)<=s.range).sort((a,b)=>b.i-a.i)[0];if(target){shots.push({x:t.x,y:t.y,target,dmg:s.dmg});t.last=s.rate}}}for(let i=shots.length-1;i>=0;i--){let q=shots[i],e=q.target;if(!enemies.includes(e)){shots.splice(i,1);continue}let dx=e.x-q.x,dy=e.y-q.y,d=Math.hypot(dx,dy),st=500*dt;if(d<=st){e.h-=q.dmg;shots.splice(i,1);if(e.h<=0){money+=e.reward;enemies.splice(enemies.indexOf(e),1)}}else{q.x+=dx/d*st;q.y+=dy/d*st}}if(!left&&!enemies.length&&wave>=10)win();document.getElementById('money').textContent=money;document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave}function draw(){ctx.clearRect(0,0,900,560);ctx.strokeStyle='#42543e';ctx.lineWidth=54;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(...path[0]);path.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.strokeStyle='#687a61';ctx.lineWidth=44;ctx.beginPath();ctx.moveTo(...path[0]);path.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();for(const t of towers){let s=types[t.type];ctx.beginPath();ctx.arc(t.x,t.y,s.range,0,7);ctx.strokeStyle='#ffffff22';ctx.stroke();ctx.beginPath();ctx.arc(t.x,t.y,20,0,7);ctx.fillStyle=t.type==='basic'?'#60a5fa':t.type==='rapid'?'#a78bfa':'#fb923c';ctx.fill()}for(const e of enemies){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fillStyle=e.boss?'#ef4444':'#f87171';ctx.fill();ctx.fillStyle='#111';ctx.fillRect(e.x-18,e.y-e.r-9,36,5);ctx.fillStyle='#4ade80';ctx.fillRect(e.x-18,e.y-e.r-9,36*Math.max(0,e.h/e.max),5)}for(const q of shots){ctx.beginPath();ctx.arc(q.x,q.y,5,0,7);ctx.fillStyle='#fff';ctx.fill()}}function msg(s){document.getElementById('msg').textContent=s}function lose(){over=true;msg('💀 แพ้! ฐานถูกทำลาย')}function win(){over=true;msg('🏆 ชนะ! ผ่าน 10 Waves แล้ว')}function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}loop(last);</script></body></html>
