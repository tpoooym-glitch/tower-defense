<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime Tower Defense V3</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#30205b,#090d18 75%);color:#fff;font:15px Arial;text-align:center}header{padding:10px}.top,.cards{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.stat,.card,button{background:#211c38;color:#fff;border:1px solid #65548f;border-radius:10px;padding:9px 12px}.stat b{color:#ffd166}.card{cursor:pointer}.card.sel{border-color:#ffd166;box-shadow:0 0 12px #ffd16644}button{cursor:pointer}button:hover{background:#3a2d5c}canvas{max-width:96vw;border:2px solid #765ea7;border-radius:14px;background:#11172a;box-shadow:0 0 25px #0008}#msg{min-height:22px;font-weight:bold}.panel{margin:6px auto;max-width:900px;color:#cfc6e8}.small{font-size:11px;color:#bdb3d5}</style></head><body><header><h1>🌸 Anime Tower Defense V3</h1><div class="top"><span class="stat">💰 <b id="money">400</b></span><span class="stat">❤️ <b id="hp">30</b></span><span class="stat">🌊 <b id="wave">0</b>/15</span><span class="stat">⭐ <b id="gems">3</b></span><button onclick="startWave()">▶ Wave</button><button onclick="summon()">🎲 Summon 100💰</button><button onclick="upgrade()">⬆️ Upgrade</button><button onclick="location.reload()">🔄 รีเซ็ต</button></div><div class="cards"><div class="card sel" data-t="sora">⚔️ Sora<div class="small">$60 • สมดุล</div></div><div class="card" data-t="rei">🏹 Rei<div class="small">$85 • เร็ว</div></div><div class="card" data-t="kaito">🔥 Kaito<div class="small">$110 • หนัก</div></div><div class="card" data-t="mika">✨ Mika<div class="small">$140 • Support</div></div><div class="card" data-t="yuna">🌙 Yuna<div class="small">$180 • AOE</div></div></div><div id="msg">เลือกตัวละครแล้วคลิกแผนที่เพื่อวาง • คลิก Tower เพื่อเลือกอัปเกรด</div></header><canvas id="game" width="900" height="560"></canvas><div class="panel">V3 เพิ่มระบบ <b>Upgrade + Summon + EXP + 15 Waves + Boss ทุก 5 Wave</b> โดยยังคงเป็นไฟล์เดียว</div><script>const c=document.getElementById('game'),x=c.getContext('2d');let money=400,hp=30,wave=0,gems=3,sel='sora',pick=null,Tw=[],En=[],Bul=[],FX=[],left=0,spawn=0,over=false,last=performance.now();const path=[[-20,90],[170,90],[170,220],[410,220],[410,430],[670,430],[670,145],[920,145]],D={sora:{cost:60,r:125,d:22,rate:650,icon:'⚔️',col:'#67b7ff'},rei:{cost:85,r:115,d:10,rate:240,icon:'🏹',col:'#c39bff'},kaito:{cost:110,r:145,d:48,rate:1050,icon:'🔥',col:'#ff805d'},mika:{cost:140,r:130,d:7,rate:800,icon:'✨',col:'#7ee8c8',support:1},yuna:{cost:180,r:150,d:26,rate:850,icon:'🌙',col:'#8c9cff',aoe:58}};document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{document.querySelectorAll('.card').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');sel=b.dataset.t;pick=null});function startWave(){if(over||left||En.length||wave>=15)return;wave++;left=5+wave*2;spawn=0;msg('🌸 Wave '+wave+' เริ่ม! '+(wave%5===0?'👑 BOSS WAVE!':''))}function summon(){if(money<100)return msg('💰 เงินไม่พอ');money-=100;let a=Math.random();let r=a<.5?'sora':a<.78?'rei':a<.94?'kaito':a<.99?'mika':'yuna';sel=r;document.querySelectorAll('.card').forEach(z=>z.classList.toggle('sel',z.dataset.t===r));msg('🎲 Summon ได้ '+D[r].icon+' '+r.toUpperCase()+'!');ui()}c.onclick=e=>{if(over)return;let r=c.getBoundingClientRect(),X=(e.clientX-r.left)*900/r.width,Y=(e.clientY-r.top)*560/r.height;let hit=Tw.find(t=>Math.hypot(t.x-X,t.y-Y)<28);if(hit){pick=hit;msg('เลือก '+hit.type+' Lv.'+hit.lv+' — กด Upgrade');return}let s=D[sel];if(money<s.cost)return msg('💰 เงินไม่พอ');if(near(X,Y)<32||Tw.some(t=>Math.hypot(t.x-X,t.y-Y)<42))return msg('วางตรงนี้ไม่ได้');Tw.push({x:X,y:Y,type:sel,lv:1,last:0,buff:1});money-=s.cost;ui()};function upgrade(){if(!pick)return msg('คลิก Tower ที่ต้องการอัปเกรดก่อน');let cost=80*pick.lv;if(money<cost)return msg('💰 Upgrade ต้องใช้ '+cost);if(pick.lv>=5)return msg('⭐ Level สูงสุดแล้ว');money-=cost;pick.lv++;msg('⬆️ '+pick.type+' อัปเป็น Lv.'+pick.lv);ui()}function near(X,Y){let z=999;for(let i=0;i<path.length-1;i++){let a=path[i],b=path[i+1],dx=b[0]-a[0],dy=b[1]-a[1],t=Math.max(0,Math.min(1,((X-a[0])*dx+(Y-a[1])*dy)/(dx*dx+dy*dy))),px=a[0]+t*dx,py=a[1]+t*dy;z=Math.min(z,Math.hypot(X-px,Y-py))}return z}function enemy(){let boss=wave%5===0&&left===1,max=boss?450:55+wave*15;En.push({x:path[0][0],y:path[0][1],i:0,h:max,max,spd:boss?36:52+wave*1.8,r:boss?21:13,reward:boss?100:15,boss});left--}function update(dt){if(over)return;if(left&&(spawn-=dt)<=0){enemy();spawn=.55}for(let i=En.length-1;i>=0;i--){let e=En[i],p=path[e.i+1];if(!p){hp--;En.splice(i,1);if(hp<=0)lose();continue}let dx=p[0]-e.x,dy=p[1]-e.y,d=Math.hypot(dx,dy),st=e.spd*dt;if(d<=st){e.x=p[0];e.y=p[1];e.i++;if(e.i>=path.length-1){hp--;En.splice(i,1);if(hp<=0)lose()}}else{e.x+=dx/d*st;e.y+=dy/d*st}}for(let t of Tw){let s=D[t.type],lv=t.lv,rate=s.rate/(1+lv*.12);t.last-=dt*1000;if(t.last<=0&&!s.support){let e=En.filter(q=>Math.hypot(q.x-t.x,q.y-t.y)<=s.r).sort((a,b)=>b.i-a.i)[0];if(e){Bul.push({x:t.x,y:t.y,e,d:s.d*(1+(lv-1)*.35),aoe:s.aoe||0});t.last=rate}}if(t.last<=0&&s.support){for(let a of Tw)if(a!==t&&Math.hypot(a.x-t.x,a.y-t.y)<s.r)a.buff=1+lv*.04;t.last=s.rate}}for(let i=Bul.length-1;i>=0;i--){let b=Bul[i],e=b.e;if(!En.includes(e)){Bul.splice(i,1);continue}let dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy),st=560*dt;if(d<=st){if(b.aoe)for(let q of En)if(Math.hypot(q.x-e.x,q.y-e.y)<=b.aoe)q.h-=b.d;else e.h-=b.d;else e.h-=b.d;FX.push({x:e.x,y:e.y,t:.3});Bul.splice(i,1);for(let j=En.length-1;j>=0;j--)if(En[j].h<=0){money+=En[j].reward;En.splice(j,1)}}else{b.x+=dx/d*st;b.y+=dy/d*st}}if(!left&&!En.length&&wave>=15)win();ui()}function ui(){moneyEl.textContent=money;document.getElementById('hp').textContent=hp;document.getElementById('wave').textContent=wave;document.getElementById('gems').textContent=gems}function draw(){x.clearRect(0,0,900,560);let g=x.createLinearGradient(0,0,900,560);g.addColorStop(0,'#1a2850');g.addColorStop(1,'#111326');x.fillStyle=g;x.fillRect(0,0,900,560);x.strokeStyle='#352e48';x.lineWidth=58;x.lineCap='round';x.beginPath();x.moveTo(...path[0]);path.slice(1).forEach(p=>x.lineTo(...p));x.stroke();x.strokeStyle='#62556a';x.lineWidth=46;x.beginPath();x.moveTo(...path[0]);path.slice(1).forEach(p=>x.lineTo(...p));x.stroke();x.font='28px Arial';x.fillText('🏯',805,125);for(let t of Tw){let s=D[t.type];x.beginPath();x.arc(t.x,t.y,s.r,0,7);x.strokeStyle=(pick===t?'#ffd166':s.col)+'66';x.stroke();x.beginPath();x.arc(t.x,t.y,24,0,7);x.fillStyle=s.col;x.fill();x.font='22px Arial';x.textAlign='center';x.fillText(s.icon,t.x,t.y+8);x.font='11px Arial';x.fillStyle='#fff';x.fillText('Lv.'+t.lv,t.x,t.y+40);x.textAlign='left'}for(let e of En){x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fillStyle=e.boss?'#b84cff':'#ef6b86';x.fill();x.font=e.boss?'23px Arial':'18px Arial';x.textAlign='center';x.fillText(e.boss?'👑':'👾',e.x,e.y+7);x.textAlign='left';x.fillStyle='#111';x.fillRect(e.x-20,e.y-e.r-10,40,5);x.fillStyle='#5df29a';x.fillRect(e.x-20,e.y-e.r-10,40*Math.max(0,e.h/e.max),5)}for(let b of Bul){x.beginPath();x.arc(b.x,b.y,5,0,7);x.fillStyle='#ffe98a';x.fill()}for(let f of FX){x.beginPath();x.arc(f.x,f.y,(.3-f.t)*120,0,7);x.strokeStyle='#ffd166';x.stroke();f.t-=.016}FX=FX.filter(f=>f.t>0)}function msg(s){document.getElementById('msg').textContent=s}function lose(){over=true;msg('💀 ฐานถูกทำลาย — แพ้')}function win(){over=true;msg('🏆 ผ่าน 15 Waves! Anime Hero!')}function loop(n){let dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}ui();loop(last)</script></body></html>
