<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arelia: Quest World</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}h1{margin:12px 0 2px;color:#ffd166;letter-spacing:2px}.sub{color:#9aa4b2;font-size:13px;margin-bottom:8px;text-align:center}.wrap{position:relative;width:min(960px,100vw);padding:0 8px 12px}.game{position:relative;border:2px solid #596275;border-radius:10px;overflow:hidden;background:#18202d;box-shadow:0 10px 35px #0008}canvas{display:block;width:100%;image-rendering:pixelated}.hud{position:absolute;left:10px;top:10px;background:#0b1020dd;border:1px solid #697386;border-radius:8px;padding:8px;min-width:220px;font-size:12px;pointer-events:none}.bar{height:7px;background:#303747;border-radius:5px;margin:3px 0 5px;overflow:hidden}.fill{height:100%}.hp{background:#e63946}.mp{background:#4cc9f0}.xp{background:#90be6d}.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,92%);max-height:82%;overflow:auto;background:#121827f5;border:2px solid #ffd166;border-radius:10px;padding:16px;display:none;z-index:5;box-shadow:0 18px 50px #000b}.panel h2{margin:0 0 10px;color:#ffd166}.row{display:flex;gap:8px;flex-wrap:wrap}.card{flex:1;min-width:170px;background:#1c2535;border:1px solid #455066;border-radius:8px;padding:10px}.btn{border:1px solid #667085;background:#222c3d;color:#fff;border-radius:6px;padding:7px 10px;cursor:pointer}.btn:hover{background:#344158}.danger{color:#ff7b7b}.ok{color:#9be564}.hint{position:absolute;bottom:7px;left:10px;right:10px;color:#b8c0cc;background:#0b1020b8;padding:5px 8px;border-radius:6px;font-size:11px;pointer-events:none}.toast{position:absolute;left:50%;bottom:45px;transform:translateX(-50%);background:#000d;border:1px solid #ffd166;color:#fff;padding:7px 12px;border-radius:6px;display:none;z-index:8}.small{font-size:11px;color:#aab3c2}.quest{padding:8px;margin:6px 0;background:#1b2433;border-left:3px solid #ffd166;border-radius:5px}.equip{color:#7dd3fc}.legend{font-size:12px;color:#aab3c2;margin-top:8px}
</style>
</head>
<body>
<h1>ARELIA: QUEST WORLD</h1><div class="sub">2D Top-Down Fantasy MMORPG-style prototype · ไม่มีเนื้อเรื่องหลัก · รับเควสซ้ำจาก NPC</div>
<div class="wrap"><div class="game"><canvas id="game" width="960" height="600"></canvas>
<div class="hud"><b id="name">Adventurer</b> · <span id="classText">Warrior</span><br><span id="level">Lv.1</span> · Gold <span id="gold">0</span><div class="bar"><div id="hp" class="fill hp"></div></div><div class="bar"><div id="mp" class="fill mp"></div></div><div class="bar"><div id="xp" class="fill xp"></div></div><span id="stats">ATK 10 · DEF 4 · SPD 150</span></div>
<div id="panel" class="panel"></div><div id="toast" class="toast"></div><div class="hint">WASD / ลูกศร เดิน · SPACE โจมตี · 1-3 สกิล · E คุย/รับ/ส่งเควส · Q เควส · I กระเป๋า · P สเตตัส · K คลาส · T สกิล · ESC ปิดหน้าต่าง</div>
</div></div></div>
<script>
'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d');
const W=C.width,H=C.height,T=32,MW=60,MH=45;
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();handleKey(e.key.toLowerCase())});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const world={w:MW*T,h:MH*T};
let state={name:'Adventurer',cls:'warrior',level:1,xp:0,gold:100,hp:120,mp:60,stat:{atk:10,def:4,spd:150},points:0,inventory:{Potion:3,'Goblin Ear':0,'Wolf Fang':0,'Slime Core':0,'Ancient Coin':0},quests:[],kills:{goblin:0,wolf:0,slime:0},map:'meadow',saveTime:0};
const classes={warrior:{name:'Warrior',hp:120,mp:60,atk:10,def:4,spd:150,skill:['Power Slash','Guard Break','Whirlwind']},mage:{name:'Mage',hp:80,mp:120,atk:14,def:2,spd:145,skill:['Fire Bolt','Ice Burst','Arcane Nova']},rogue:{name:'Rogue',hp:90,mp:75,atk:12,def:3,spd:175,skill:['Quick Strike','Poison Edge','Shadow Dash']}};
const zones=[{id:'meadow',name:'Emerald Meadow',x:0,y:0,w:960,h:720,color:'#2d6a4f',level:[1,10]},{id:'swamp',name:'Murk Swamp',x:960,y:0,w:960,h:720,color:'#356b52',level:[8,18]},{id:'desert',name:'Golden Desert',x:1920,y:0,w:960,h:720,color:'#caa85a',level:[15,28]},{id:'ruins',name:'Ancient Ruins',x:0,y:720,w:960,h:720,color:'#59636e',level:[25,40]},{id:'snow',name:'Frostpeak',x:960,y:720,w:960,h:720,color:'#b9cbd5',level:[38,55]},{id:'lava',name:'Ember Crater',x:1920,y:720,w:960,h:720,color:'#7f2929',level:[50,70]}];
const npcs=[{id:'guild',x:440,y:310,name:'Quest Guild',color:'#ffd166',lines:['รับเควสได้สูงสุด 5 เควส','กลับมาหาข้าเมื่อทำสำเร็จ']},{id:'smith',x:560,y:310,name:'Blacksmith',color:'#b0b7c3',lines:['ข้าขายอุปกรณ์พื้นฐาน','อัปเกรดพลังโจมตีได้']},{id:'healer',x:500,y:370,name:'Healer',color:'#90e0ef',lines:['พักฟื้นได้ฟรี','ขอให้แสงสว่างคุ้มครองเจ้า']},{id:'class',x:620,y:370,name:'Class Master',color:'#c77dff',lines:['Warrior, Mage หรือ Rogue','เปลี่ยนคลาสได้ทุกเมื่อ']},{id:'king',x:500,y:250,name:'King Aethelgard',color:'#ef476f',lines:['ยินดีต้อนรับสู่อาณาจักร Arelia'] }];
let mobs=[];let effects=[];let camera={x:0,y:0};let attackCD=0;let skillCD=[0,0,0];let panelOpen=false;
function zoneAt(x,y){return zones.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h)||zones[0]}
function makeWorld(){for(let i=0;i<55;i++){let z=zones[Math.floor(Math.random()*zones.length)];mobs.push(spawnMob(z));}}
function spawnMob(z){let type=['goblin','wolf','slime'][Math.floor(Math.random()*3)];let lv=clamp(z.level[0]+Math.floor(Math.random()*(z.level[1]-z.level[0]+1)),1,70);let base={goblin:[42,8,10,'Goblin','Goblin Ear','#72b01d'],wolf:[34,10,9,'Dire Wolf','Wolf Fang','#9aa0a6'],slime:[55,6,12,'Slime','Slime Core','#4cc9f0']}[type];return {type,lv,hp:base[0]+lv*5,max:base[0]+lv*5,atk:base[1]+Math.floor(lv*.8),xp:base[2]+lv,drop:base[4],name:base[3],color:base[5],x:z.x+50+Math.random()*(z.w-100),y:z.y+70+Math.random()*(z.h-120),r:13,hit:0,dead:false,wander:Math.random()*6.28};}
function resetClass(){let c=classes[state.cls];state.hp=Math.min(state.hp,c.hp+state.level*8);state.mp=c.mp+state.level*4;state.stat={atk:c.atk+state.level-1,def:c.def+Math.floor(state.level/4),spd:c.spd};}
function gainXP(n){state.xp+=n;while(state.xp>=state.level*100){state.xp-=state.level*100;state.level++;state.points+=3;resetClass();toast('Level Up! Lv.'+state.level);}}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1500)}
function addQuest(type){if(state.quests.filter(q=>q.active).length>=5){toast('รับเควสครบ 5 เควสแล้ว');return}let templates={hunt_goblin:['Goblin Cleanup','กำจัด Goblin 5 ตัว', 'goblin',5,70,40],hunt_wolf:['Wolf Patrol','กำจัด Dire Wolf 5 ตัว','wolf',5,80,45],hunt_slime:['Slime Problem','กำจัด Slime 6 ตัว','slime',6,90,50],explore:['Explorer','เดินทางไปยัง Ancient Ruins','explore',1,100,60]};let k=type||Object.keys(templates)[Math.floor(Math.random()*Object.keys(templates).length)],t=templates[k];state.quests.push({id:Date.now()+Math.random(),title:t[0],desc:t[1],type:t[2],need:t[3],rewardGold:t[4],rewardXP:t[5],count:0,active:true});toast('รับเควส: '+t[0])}
function questProgress(q){if(q.type==='explore')return zoneAt(state.x,state.y).id==='ruins'?1:0;return state.kills[q.type]||0}
function updateQuests(){for(const q of state.quests)if(q.active){q.count=questProgress(q);}}
function turnInQuests(){let n=0;for(const q of state.quests){if(q.active&&q.count>=q.need){q.active=false;q.done=true;state.gold+=q.rewardGold;gainXP(q.rewardXP);n++;}}if(n)toast('ส่งเควสสำเร็จ '+n+' เควส');else toast('ยังไม่มีเควสที่สำเร็จ')}
function interact(){let near=npcs.map(n=>({...n,d:Math.hypot(n.x-state.x,n.y-state.y)})).sort((a,b)=>a.d-b.d)[0];if(!near||near.d>70){toast('ไม่มี NPC ใกล้พอ');return}if(near.id==='healer'){resetClass();toast('ฟื้น HP/MP แล้ว');return}if(near.id==='class'){openPanel('class');return}if(near.id==='smith'){if(state.gold>=50){state.gold-=50;state.stat.atk++;toast('ตีเหล็ก: ATK +1')}else toast('ต้องมี 50 Gold');return}if(near.id==='guild'){turnInQuests();openPanel('quests');return}toast(near.name+': '+near.lines[0])}
function attack(){if(attackCD>0||panelOpen)return;attackCD=300;effects.push({x:state.x,y:state.y,t:0,max:160});for(const m of mobs){if(m.dead)continue;let d=Math.hypot(m.x-state.x,m.y-state.y);if(d<72){let dmg=state.stat.atk+Math.floor(Math.random()*5);m.hp-=dmg;m.hit=100;if(m.hp<=0)killMob(m)}}}
function useSkill(i){if(panelOpen||skillCD[i]>0)return;let costs=[15,25,35],cost=costs[i];if(state.mp<cost){toast('MP ไม่พอ');return}state.mp-=cost;skillCD[i]=[1200,1800,2800][i];let mult=state.cls==='mage'?[2.1,2.7,3.5][i]:state.cls==='rogue'?[1.8,2.4,3.1][i]:[1.7,2.2,3][i];let range=[100,125,155][i];for(const m of mobs){if(m.dead)continue;if(Math.hypot(m.x-state.x,m.y-state.y)<range){m.hp-=Math.floor(state.stat.atk*mult);m.hit=160;if(m.hp<=0)killMob(m)}}effects.push({x:state.x,y:state.y,t:0,max:400});toast(classes[state.cls].skill[i])}
function killMob(m){m.dead=true;state.kills[m.type]++;state.gold+=Math.floor(3+m.lv*.6);state.inventory[m.drop]=(state.inventory[m.drop]||0)+1;gainXP(m.xp);setTimeout(()=>{let z=zoneAt(state.x,state.y);Object.assign(m,spawnMob(z));},2500)}
function move(dt){if(panelOpen)return;let dx=0,dy=0;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(dx&&dy){dx*=.707;dy*=.707}state.x=clamp(state.x+dx*state.stat.spd*dt/1000,12,world.w-12);state.y=clamp(state.y+dy*state.stat.spd*dt/1000,12,world.h-12)}
function updateMobs(dt){for(const m of mobs){if(m.dead)continue;m.hit=Math.max(0,m.hit-dt);let d=Math.hypot(m.x-state.x,m.y-state.y);if(d<260){m.x+=(state.x-m.x)/Math.max(d,1)*(18+m.lv*.35)*dt/1000;m.y+=(state.y-m.y)/Math.max(d,1)*(18+m.lv*.35)*dt/1000;if(d<30&&Math.random()<.02){state.hp-=Math.max(1,m.atk-state.stat.def);if(state.hp<=0){state.hp=classes[state.cls].hp;state.x=450;state.y=430;state.gold=Math.max(0,state.gold-10);toast('พ่ายแพ้! กลับเมืองแล้ว')}}}else{m.wander+=dt*.0004;m.x+=Math.cos(m.wander)*8*dt/1000;m.y+=Math.sin(m.wander)*8*dt/1000}}}
function draw(){ctx.clearRect(0,0,W,H);camera.x=clamp(state.x-W/2,0,world.w-W);camera.y=clamp(state.y-H/2,0,world.h-H);let zx=Math.floor(camera.x/T)*T,zy=Math.floor(camera.y/T)*T;for(let y=zy;y<camera.y+H+T;y+=T)for(let x=zx;x<camera.x+W+T;x+=T){let z=zoneAt(x+T/2,y+T/2);ctx.fillStyle=z.color;ctx.fillRect(x-camera.x,y-camera.y,T,T);if(((x/T+y/T)%7)===0){ctx.fillStyle='#ffffff12';ctx.fillRect(x-camera.x+5,y-camera.y+5,3,3)}}
// roads
ctx.strokeStyle='#d6c58b55';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-camera.x,430-camera.y);ctx.lineTo(world.w-camera.x,430-camera.y);ctx.stroke();
// NPCs
for(const n of npcs){if(n.x<camera.x-40||n.x>camera.x+W+40||n.y<camera.y-40||n.y>camera.y+H+40)continue;let sx=n.x-camera.x,sy=n.y-camera.y;ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(sx,sy,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(sx-7,sy-4,4,4);ctx.fillRect(sx+3,sy-4,4,4);ctx.fillStyle='#fff';ctx.font='11px system-ui';ctx.textAlign='center';ctx.fillText(n.name,sx,sy-22)}
for(const m of mobs){if(m.dead)continue;let sx=m.x-camera.x,sy=m.y-camera.y;if(sx<-30||sx>W+30||sy<-30||sy>H+30)continue;ctx.fillStyle=m.hit?'#fff':m.color;ctx.beginPath();ctx.arc(sx,sy,m.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(sx-5,sy-3,3,3);ctx.fillRect(sx+2,sy-3,3,3);ctx.fillStyle='#111';ctx.fillRect(sx-16,sy-23,32,4);ctx.fillStyle='#e63946';ctx.fillRect(sx-16,sy-23,32*(m.hp/m.max),4);ctx.fillStyle='#fff';ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(m.name+' Lv.'+m.lv,sx,sy+26)}
// player
let px=state.x-camera.x,py=state.y-camera.y;ctx.fillStyle=state.cls==='mage'?'#4cc9f0':state.cls==='rogue'?'#c77dff':'#ef476f';ctx.beginPath();ctx.arc(px,py,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-6,py-4,3,0,Math.PI*2);ctx.arc(px+6,py-4,3,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffd166';ctx.strokeRect(px-19,py-19,38,38);
for(const e of effects){let a=e.t/e.max;ctx.strokeStyle='#ffd166';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x-camera.x,e.y-camera.y,30+90*a,0,Math.PI*2);ctx.stroke();e.t+=16}effects=effects.filter(e=>e.t<e.max);
let z=zoneAt(state.x,state.y);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='right';ctx.fillText(z.name+' · Lv.'+z.level[0]+'-'+z.level[1],W-12,22);ctx.textAlign='left';updateHUD();}
function updateHUD(){document.getElementById('classText').textContent=classes[state.cls].name;document.getElementById('level').textContent='Lv.'+state.level;document.getElementById('gold').textContent=state.gold;document.getElementById('hp').style.width=clamp(state.hp/(classes[state.cls].hp+state.level*8)*100,0,100)+'%';document.getElementById('mp').style.width=clamp(state.mp/(classes[state.cls].mp+state.level*4)*100,0,100)+'%';document.getElementById('xp').style.width=(state.xp/(state.level*100))*100+'%';document.getElementById('stats').textContent=`ATK ${state.stat.atk} · DEF ${state.stat.def} · SPD ${state.stat.spd}`}
function openPanel(type){panelOpen=true;let p=document.getElementById('panel');p.style.display='block';if(type==='quests'){updateQuests();p.innerHTML='<h2>📜 Quest Board</h2><p>รับได้สูงสุด 5 เควสพร้อมกัน</p>'+state.quests.map(q=>`<div class="quest"><b>${q.title}</b> — ${q.desc}<br><span class="small">${q.count}/${q.need} · รางวัล ${q.rewardGold}G + ${q.rewardXP} XP ${q.done?'<span class="ok">✓ สำเร็จ</span>':''}</span></div>`).join('')+`<div class="row"><button class="btn" onclick="addQuest('hunt_goblin')">รับ Goblin</button><button class="btn" onclick="addQuest('hunt_wolf')">รับ Wolf</button><button class="btn" onclick="addQuest('hunt_slime')">รับ Slime</button><button class="btn" onclick="addQuest('explore')">รับ Explore</button><button class="btn" onclick="closePanel()">ปิด</button></div>`}
else if(type==='inventory'){p.innerHTML='<h2>🎒 Inventory</h2>'+Object.entries(state.inventory).map(([k,v])=>`<div class="card"><b>${k}</b> × ${v}</div>`).join('')+`<br><button class="btn" onclick="usePotion()">ใช้ Potion</button> <button class="btn" onclick="closePanel()">ปิด</button>`}
else if(type==='stats'){p.innerHTML=`<h2>📊 Character</h2><p>${state.name} · ${classes[state.cls].name} · Level ${state.level}</p><div class="card">ATK ${state.stat.atk}<br>DEF ${state.stat.def}<br>SPD ${state.stat.spd}<br>Stat Points: ${state.points}</div><p>กด P เพื่อปิด · ระบบพัฒนา Stats จะขยายต่อได้</p><button class="btn" onclick="closePanel()">ปิด</button>`}
else if(type==='class'){p.innerHTML='<h2>⚔️ Class Master</h2><p>เลือกคลาสได้โดยไม่เสียค่าใช้จ่าย</p><div class="row">'+Object.entries(classes).map(([k,c])=>`<div class="card"><b>${c.name}</b><br>HP ${c.hp} · MP ${c.mp}<br>ATK ${c.atk} · DEF ${c.def} · SPD ${c.spd}<br><button class="btn" onclick="changeClass('${k}')">เลือก ${c.name}</button></div>`).join('')+'</div><br><button class="btn" onclick="closePanel()">ปิด</button>'}
else if(type==='skills'){p.innerHTML=`<h2>✨ Skill Tree</h2><p>คลาส ${classes[state.cls].name}</p>`+classes[state.cls].skill.map((s,i)=>`<div class="quest"><b>${i+1}. ${s}</b><br><span class="small">MP ${[15,25,35][i]} · Cooldown ${[1.2,1.8,2.8][i]}s</span></div>`).join('')+'<button class="btn" onclick="closePanel()">ปิด</button>'}}
function closePanel(){panelOpen=false;document.getElementById('panel').style.display='none'}
function changeClass(k){state.cls=k;resetClass();toast('เปลี่ยนคลาสเป็น '+classes[k].name);closePanel()}
function usePotion(){if(state.inventory.Potion>0){state.inventory.Potion--;state.hp=Math.min(classes[state.cls].hp+state.level*8,state.hp+50);toast('ฟื้น HP +50')}else toast('ไม่มี Potion')}
function handleKey(k){if(k==='escape')closePanel();if(k==='e'&&!panelOpen)interact();if(k===' '&&!panelOpen)attack();if(k==='1')useSkill(0);if(k==='2')useSkill(1);if(k==='3')useSkill(2);if(k==='q'&&!panelOpen)openPanel('quests');if(k==='i'&&!panelOpen)openPanel('inventory');if(k==='p'&&!panelOpen)openPanel('stats');if(k==='k'&&!panelOpen)openPanel('class');if(k==='t'&&!panelOpen)openPanel('skills');}
function save(){localStorage.setItem('arelia-save',JSON.stringify(state));state.saveTime=Date.now();toast('บันทึกเกมแล้ว')}
function load(){let s=localStorage.getItem('arelia-save');if(s){try{state=Object.assign(state,JSON.parse(s));resetClass()}catch(e){}}}
setInterval(save,15000);load();resetClass();makeWorld();
let last=performance.now();function loop(now){let dt=now-last;last=now;attackCD=Math.max(0,attackCD-dt);skillCD=skillCD.map(v=>Math.max(0,v-dt));move(dt);updateMobs(dt);updateQuests();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
