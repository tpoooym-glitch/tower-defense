<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ดาวน์โหลด Tower Defense V1</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#fff;font-family:Arial,sans-serif}.box{width:min(620px,90%);padding:32px;text-align:center;background:#1d293b;border-radius:18px}.btn{display:inline-block;padding:14px 22px;background:#3b82f6;color:#fff;text-decoration:none;border-radius:10px;font-weight:700;border:0;cursor:pointer;font-size:16px}.back{display:block;margin-top:18px;color:#a9bdd8}</style></head><body><main class="box"><h1>🎮 Tower Defense V1</h1><p>ดาวน์โหลดเกมเป็นไฟล์ HTML ไฟล์เดียว แล้วเปิดด้วย Chrome ได้ทันที</p><button class="btn" id="download">⬇️ ดาวน์โหลดเกม</button><a class="back" href="./index.html">▶ เล่นเกมออนไลน์</a></main><script>document.getElementById('download').onclick=async()=>{try{const r=await fetch('./index.html');if(!r.ok)throw new Error('โหลดไฟล์ไม่สำเร็จ');const text=await r.text();const blob=new Blob([text],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Tower-Defense-V1.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){alert('ดาวน์โหลดไม่สำเร็จ กรุณาเปิดเกมผ่าน GitHub Pages ก่อน')}};</script></body></html>
